services:
  # app:
  #   build: .
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     APP_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/voltis
  #   depends_on:
  #     - postgres
  #   volumes:
  #     - /my/library/1:/app/library/1
  #     - /my/library/2:/app/library/2

  postgres:
    image: paradedb/paradedb:0.21.8-pg18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Local OIDC provider. Only started with: docker compose --profile oidc up -d
  dex:
    profiles: ["oidc"]
    image: ghcr.io/dexidp/dex:v2.44.0
    command: dex serve /etc/dex/config.yaml
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro

  # Forwarded auth. Only started with: docker compose --profile proxy-auth up -d
  authelia:
    profiles: ["proxy-auth"]
    image: authelia/authelia:4.37.5
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ./dev/authelia/configuration.yml:/config/configuration.yml:ro
      - ./dev/authelia/users.yml:/config/users.yml:ro
      - authelia_data:/data

  caddy:
    profiles: ["proxy-auth"]
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - ./dev/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - authelia

volumes:
  postgres_data:
  authelia_data:
