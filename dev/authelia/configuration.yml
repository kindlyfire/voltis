# Authelia for local forwarded-auth testing. Brought up with:
#   docker compose --profile proxy-auth up -d
#
# Pinned to 4.37: from 4.38 Authelia requires a dotted cookie domain, which a
# localhost setup cannot provide.
theme: light
jwt_secret: dev-jwt-secret-not-for-production-use-0001
default_redirection_url: https://localhost:9443

server:
  host: 0.0.0.0
  port: 9091
  # The portal is served through Caddy at /authelia, so the browser only ever
  # talks to one origin and Authelia's session cookie applies to both.
  path: authelia

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: one_factor

session:
  name: authelia_session
  domain: localhost
  secret: dev-session-secret-not-for-production-0002
  expiration: 1h
  inactivity: 15m

regulation:
  max_retries: 10
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: dev-storage-encryption-key-not-for-production
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
